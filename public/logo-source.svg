<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <!-- Subtle shadow under pin -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Location Pin Shape -->
  <path d="M256 24 C148 24 64 104 64 200 C64 332 256 488 256 488 C256 488 448 332 448 200 C448 104 364 24 256 24Z"
        fill="url(#pinGrad)" filter="url(#shadow)"/>

  <!-- Inner white circle -->
  <circle cx="256" cy="196" r="128" fill="white"/>

  <!-- Building group - centered in circle, bold and simple -->
  <g transform="translate(256, 190)">
    <!-- Main building body -->
    <rect x="-56" y="-24" width="112" height="76" rx="4" fill="url(#buildingGrad)"/>

    <!-- Peaked roof -->
    <polygon points="-64,-20 0,-72 64,-20" fill="#78350F"/>

    <!-- Chimney -->
    <rect x="28" y="-60" width="18" height="32" rx="2" fill="#92400E"/>

    <!-- Door (centered, amber) -->
    <rect x="-12" y="16" width="24" height="36" rx="4" fill="#F59E0B"/>
    <circle cx="6" cy="35" r="3" fill="#92400E"/>

    <!-- Windows - row 1 (bigger, bolder for small sizes) -->
    <rect x="-44" y="-12" width="22" height="18" rx="3" fill="#FDE68A"/>
    <rect x="22" y="-12" width="22" height="18" rx="3" fill="#FDE68A"/>

    <!-- Window cross dividers (thicker for visibility) -->
    <line x1="-33" y1="-12" x2="-33" y2="6" stroke="#B45309" stroke-width="2"/>
    <line x1="-44" y1="-3" x2="-22" y2="-3" stroke="#B45309" stroke-width="2"/>

    <line x1="33" y1="-12" x2="33" y2="6" stroke="#B45309" stroke-width="2"/>
    <line x1="22" y1="-3" x2="44" y2="-3" stroke="#B45309" stroke-width="2"/>

    <!-- Windows - row 2 -->
    <rect x="-44" y="16" width="22" height="18" rx="3" fill="#FDE68A"/>
    <rect x="22" y="16" width="22" height="18" rx="3" fill="#FDE68A"/>

    <line x1="-33" y1="16" x2="-33" y2="34" stroke="#B45309" stroke-width="2"/>
    <line x1="-44" y1="25" x2="-22" y2="25" stroke="#B45309" stroke-width="2"/>

    <line x1="33" y1="16" x2="33" y2="34" stroke="#B45309" stroke-width="2"/>
    <line x1="22" y1="25" x2="44" y2="25" stroke="#B45309" stroke-width="2"/>
  </g>
</svg>