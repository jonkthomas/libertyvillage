name: Autonomous staging and promotion coordinator

on:
  repository_dispatch:
    types: [autonomous-coordinate]

concurrency:
  group: autonomous-${{ github.event.client_payload.kind == 'promotion' && 'promotion-main' || 'generator-staging' }}
  cancel-in-progress: false

env:
  AUTOMATION_KIND: ${{ github.event.client_payload.kind }}
  AUTOMATION_PR: ${{ github.event.client_payload.pr_number }}
  AUTOMATION_SHA: ${{ github.event.client_payload.head_sha }}

jobs:
  validate-generator:
    if: ${{ github.event.client_payload.kind != 'promotion' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      trusted: ${{ steps.validate.outputs.trusted }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      head_ref: ${{ steps.validate.outputs.head_ref }}
      attempt: ${{ steps.validate.outputs.attempt }}
      can_repair: ${{ steps.validate.outputs.can_repair }}
      heal_attempt: ${{ steps.validate.outputs.heal_attempt }}
      can_heal: ${{ steps.validate.outputs.can_heal }}
    steps:
      - name: Checkout trusted coordinator tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate live same-repository trusted PR, exact SHA, branch, base, and paths
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs validate-pr --repo "$GITHUB_REPOSITORY" --pr "$AUTOMATION_PR" --kind "$AUTOMATION_KIND" --sha "$AUTOMATION_SHA"

  generator-ci:
    needs: validate-generator
    if: ${{ needs.validate-generator.outputs.trusted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout synthetic merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.validate-generator.outputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Verify merge ref contains the validated exact head
        env:
          EXPECTED_SHA: ${{ needs.validate-generator.outputs.head_sha }}
        run: test "$(git rev-parse HEAD^2)" = "$EXPECTED_SHA"
      - run: npm ci
      - run: npm run lint:automation
      - run: npm run lint:supervisor
      - run: npm run lint:changed
      - run: npm run build
      - run: npm run test:automation
      - run: npm run test:supervisor
      - run: npm run test:news-pilot
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  generator-ci-status:
    needs: [validate-generator, generator-ci]
    if: ${{ always() && needs.validate-generator.outputs.trusted == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publish exact-head CI status
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.generator-ci.result }}
        run: |
          STATE=failure; [ "$CI_RESULT" = success ] && STATE=success
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-generator.outputs.head_sha }}" --context automation/ci --state "$STATE" --description "Synthetic merge CI: $CI_RESULT"

  # Residual stuck mode: staging advanced into the same monolithic data file as an
  # open generator PR, so refs/pull/N/merge is frozen and generator-ci cannot even
  # assert its exact head. Merge staging in for the branch, resolve only
  # both-appended record conflicts, and redispatch the exact healed SHA. Any other
  # shape falls through to block-generator untouched.
  heal-generator-base:
    needs: [validate-generator, generator-ci, generator-ci-status]
    if: ${{ always() && needs.validate-generator.outputs.trusted == 'true' && needs.generator-ci.result == 'failure' && needs.validate-generator.outputs.can_heal == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      healed: ${{ steps.heal.outputs.healed }}
    steps:
      - name: Checkout trusted coordinator tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout validated PR head without executing it
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-generator.outputs.head_sha }}
          path: work
          fetch-depth: 0
      - name: Merge staging and resolve only both-appended record conflicts
        id: heal
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LV Automation Fixer"
          git config user.email "noreply@libertyvillage.co"
          node ../trusted/scripts/automation/coordinator.mjs heal-generator-base --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}"
      - name: Recheck exact remote head and persist next heal attempt
        if: ${{ steps.heal.outputs.healed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.validate-generator.outputs.head_ref }}
          EXPECTED_SHA: ${{ needs.validate-generator.outputs.head_sha }}
          NEXT_HEAL: ${{ steps.heal.outputs.next_heal }}
        run: |
          REMOTE_SHA=$(git -C work ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)
          [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] || { echo "::error::PR head raced; refusing heal"; exit 1; }
          node trusted/scripts/automation/coordinator.mjs set-heal --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --heal "$NEXT_HEAL"
      - name: Recheck exact remote head and push the merge without force
        if: ${{ steps.heal.outputs.healed == 'true' }}
        working-directory: work
        env:
          HEAD_REF: ${{ needs.validate-generator.outputs.head_ref }}
          EXPECTED_SHA: ${{ needs.validate-generator.outputs.head_sha }}
        run: |
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)
          [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] || { echo "::error::PR head raced; refusing push"; exit 1; }
          git push origin "HEAD:$HEAD_REF"
      - name: Audit heal and explicitly redispatch exact new SHA
        if: ${{ steps.heal.outputs.healed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.heal.outputs.new_sha }}
        run: |
          test "$(git -C work rev-parse HEAD)" = "$NEW_SHA"
          node trusted/scripts/automation/coordinator.mjs dispatch --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "$NEW_SHA"
          node trusted/scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --decision healing --attempt "${{ needs.validate-generator.outputs.attempt }}" --out trusted/heal-audit.json
      - uses: actions/upload-artifact@v4
        if: ${{ steps.heal.outputs.healed == 'true' }}
        with:
          name: heal-audit-${{ needs.validate-generator.outputs.head_sha }}
          path: trusted/heal-audit.json
          if-no-files-found: error

  generator-review:
    needs: [validate-generator, generator-ci, generator-ci-status]
    if: ${{ needs.validate-generator.outputs.trusted == 'true' && needs.generator-ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review_ok: ${{ steps.review.outputs.review_ok }}
      passed: ${{ steps.review.outputs.passed }}
      overall: ${{ steps.review.outputs.overall }}
      repairable: ${{ steps.review.outputs.repairable }}
      converging: ${{ steps.review.outputs.converging }}
      progress_reason: ${{ steps.review.outputs.progress_reason }}
      failure_class: ${{ steps.review.outputs.failure_class }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Review untrusted PR diff as data with Opus gate
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/review-agent.mjs review --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --out gate-verdict.json
      - name: Persist review verdict
        if: ${{ steps.review.outputs.review_ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-verdict-${{ needs.validate-generator.outputs.head_sha }}
          path: gate-verdict.json
          if-no-files-found: error

  generator-gate-status:
    needs: [validate-generator, generator-ci, generator-review]
    if: ${{ always() && needs.validate-generator.outputs.trusted == 'true' && needs.generator-ci.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publish exact-head Opus status
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OK: ${{ needs.generator-review.outputs.review_ok }}
          PASSED: ${{ needs.generator-review.outputs.passed }}
        run: |
          STATE=failure; DESCRIPTION="Opus gate errored"
          if [ "$REVIEW_OK" = true ]; then DESCRIPTION="Opus gate score ${{ needs.generator-review.outputs.overall }}/10"; fi
          if [ "$REVIEW_OK" = true ] && [ "$PASSED" = true ]; then STATE=success; fi
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-generator.outputs.head_sha }}" --context automation/opus-gate --state "$STATE" --description "$DESCRIPTION"

  generator-fixer:
    # `repairable != 'false'` is the F5 short-circuit: a verdict whose blocking
    # findings are all structurally unrepairable skips the fixer entirely rather
    # than burning 3 rounds x 4 plans on a foregone conclusion.
    #
    # `converging != 'false'` is the F4 short-circuit, decided by
    # recovery.evaluateRepairProgress over the ordered gate history rebuilt from
    # this PR's durable audit comments: a round that regressed the score (#97
    # 7.2 -> 6.5, #75 5.0 -> 4.5) or that introduced a blocking finding the previous
    # round did not have abandons the repair loop here, BEFORE the fixer is
    # dispatched. block-generator then makes it a visible terminal state and the
    # bounded candidate ladder closes and regenerates from there.
    needs:
      [
        validate-generator,
        generator-ci,
        generator-review,
        generator-gate-status,
      ]
    if: ${{ needs.validate-generator.outputs.trusted == 'true' && needs.generator-review.outputs.review_ok == 'true' && needs.generator-review.outputs.passed != 'true' && needs.validate-generator.outputs.can_repair == 'true' && needs.generator-review.outputs.repairable != 'false' && needs.generator-review.outputs.converging != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fix_ok: ${{ steps.fix.outputs.fix_ok }}
      failure_class: ${{ steps.fix.outputs.failure_class }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: gate-verdict-${{ needs.validate-generator.outputs.head_sha }}
      - name: Generate bounded repair plan from untrusted file data
        id: fix
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/review-agent.mjs fix --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --verdict gate-verdict.json --out repair-plan.json
      - name: Persist repair plan
        if: ${{ steps.fix.outputs.fix_ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: repair-plan-${{ needs.validate-generator.outputs.head_sha }}
          path: repair-plan.json
          if-no-files-found: error

  apply-generator-repair:
    needs: [validate-generator, generator-review, generator-fixer]
    if: ${{ needs.validate-generator.outputs.trusted == 'true' && needs.generator-fixer.outputs.fix_ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted coordinator tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout validated PR head without executing it
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-generator.outputs.head_sha }}
          path: work
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: repair-plan-${{ needs.validate-generator.outputs.head_sha }}
          path: trusted
      - uses: actions/download-artifact@v4
        with:
          name: gate-verdict-${{ needs.validate-generator.outputs.head_sha }}
          path: trusted
      - name: Validate and apply content-only repair plan
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../trusted/scripts/automation/coordinator.mjs apply-fix --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --plan ../trusted/repair-plan.json
      - name: Recheck exact remote head and persist next repair attempt
        id: repair_attempt
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.validate-generator.outputs.head_ref }}
          EXPECTED_SHA: ${{ needs.validate-generator.outputs.head_sha }}
          CURRENT_ATTEMPT: ${{ needs.validate-generator.outputs.attempt }}
        run: |
          REMOTE_SHA=$(git -C work ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)
          [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] || { echo "::error::PR head raced; refusing repair"; exit 1; }
          NEXT_ATTEMPT=$((CURRENT_ATTEMPT + 1))
          node trusted/scripts/automation/coordinator.mjs set-attempt --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --attempt "$NEXT_ATTEMPT"
          echo "next_attempt=$NEXT_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Recheck exact remote head, commit, and push without force
        working-directory: work
        env:
          HEAD_REF: ${{ needs.validate-generator.outputs.head_ref }}
          EXPECTED_SHA: ${{ needs.validate-generator.outputs.head_sha }}
          NEXT_ATTEMPT: ${{ steps.repair_attempt.outputs.next_attempt }}
        run: |
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)
          [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] || { echo "::error::PR head raced; refusing push"; exit 1; }
          git diff --quiet && { echo "::error::Fixer produced no diff"; exit 1; }
          git config user.name "LV Automation Fixer"
          git config user.email "noreply@libertyvillage.co"
          git add --all
          git commit -m "automation: repair gate findings (attempt $NEXT_ATTEMPT)"
          git push origin "HEAD:$HEAD_REF"
      - name: Audit repair and explicitly redispatch exact new SHA
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_ATTEMPT: ${{ steps.repair_attempt.outputs.next_attempt }}
        run: |
          NEW_SHA=$(git -C work rev-parse HEAD)
          node trusted/scripts/automation/coordinator.mjs dispatch --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "$NEW_SHA"
          node trusted/scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --decision repairing --attempt "$NEXT_ATTEMPT" --verdict trusted/gate-verdict.json --out trusted/repair-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: repair-audit-${{ needs.validate-generator.outputs.head_sha }}
          path: trusted/repair-audit.json
          if-no-files-found: error

  pass-generator:
    needs:
      [
        validate-generator,
        generator-ci,
        generator-review,
        generator-gate-status,
      ]
    if: ${{ needs.validate-generator.outputs.trusted == 'true' && needs.generator-ci.result == 'success' && needs.generator-review.outputs.review_ok == 'true' && needs.generator-review.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gate-verdict-${{ needs.validate-generator.outputs.head_sha }}
      - name: Validate exact SHA and record pass
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/automation/coordinator.mjs validate-pr --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}"
          node scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --decision passed --attempt "${{ needs.validate-generator.outputs.attempt }}" --verdict gate-verdict.json --out gate-audit.json
      - name: Refresh stale staging base and explicitly redispatch exact new SHA
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs refresh-generator-base --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gate-audit-${{ needs.validate-generator.outputs.head_sha }}
          path: gate-audit.json
          if-no-files-found: error
      - name: Enable native merge-commit auto-merge into staging
        if: ${{ steps.refresh.outputs.refreshed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ needs.validate-generator.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" --auto --merge
      - name: Observe staging merge and explicitly dispatch cumulative promotion
        if: ${{ steps.refresh.outputs.refreshed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LV_PROMOTION_ENABLED: ${{ vars.LV_PROMOTION_ENABLED }}
          LV_WEEKLY_OWNER: ${{ vars.LV_WEEKLY_OWNER }}
        run: node scripts/automation/coordinator.mjs observe-and-promote --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --sha "${{ needs.validate-generator.outputs.head_sha }}"

  block-generator:
    needs:
      [
        validate-generator,
        generator-ci,
        generator-ci-status,
        heal-generator-base,
        generator-review,
        generator-gate-status,
        generator-fixer,
        apply-generator-repair,
        pass-generator,
      ]
    if: ${{ always() && needs.validate-generator.outputs.trusted == 'true' && needs.pass-generator.result != 'success' && needs.apply-generator-repair.result != 'success' && (needs.heal-generator-base.result != 'success' || needs.heal-generator-base.outputs.healed != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Download verdict when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gate-verdict-${{ needs.validate-generator.outputs.head_sha }}
      # F7. Before failing closed, ask whether this failure is a transient 502/429/
      # model error rather than a policy refusal. If it is, and the bounded retry
      # budget remains, the budget is consumed here and the same exact SHA is
      # redispatched after a backoff — a documented third continuation alongside
      # apply-generator-repair and heal-generator-base.
      - name: Classify the failure and decide on one bounded transient redispatch
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OK: ${{ needs.generator-review.outputs.review_ok }}
          REVIEW_CLASS: ${{ needs.generator-review.outputs.failure_class }}
          FIX_OK: ${{ needs.generator-fixer.outputs.fix_ok }}
          FIXER_CLASS: ${{ needs.generator-fixer.outputs.failure_class }}
        run: |
          CLASSIFICATION=terminal
          if [ "$REVIEW_OK" = false ] && [ -n "$REVIEW_CLASS" ]; then CLASSIFICATION="$REVIEW_CLASS"; fi
          if [ "$FIX_OK" = false ] && [ -n "$FIXER_CLASS" ]; then CLASSIFICATION="$FIXER_CLASS"; fi
          node scripts/automation/coordinator.mjs recover --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --classification "$CLASSIFICATION"
      - name: Back off and redispatch the same exact SHA
        if: ${{ steps.recover.outputs.action == 'retry' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-generator.outputs.head_sha }}" --context automation/opus-gate --state pending --description "Transient failure; redispatch ${{ steps.recover.outputs.attempt }}/2"
          sleep "${{ steps.recover.outputs.delay_seconds }}"
          node scripts/automation/coordinator.mjs dispatch --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}"
      # 3h. The repair budget is read live from the controlled label, not from a
      # validate-generator output captured before apply-generator-repair bumped it.
      - name: Read the live repair budget from the controlled label
        id: budget
        if: ${{ steps.recover.outputs.action != 'retry' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs read-attempt --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}"
      - name: Fail closed, label, audit, and deduplicate notification
        id: block
        if: ${{ steps.recover.outputs.action != 'retry' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.generator-ci.result }}
          REVIEW_OK: ${{ needs.generator-review.outputs.review_ok }}
          REPAIRABLE: ${{ needs.generator-review.outputs.repairable }}
          CAN_REPAIR: ${{ steps.budget.outputs.can_repair }}
          CONVERGING: ${{ needs.generator-review.outputs.converging }}
          PROGRESS_REASON: ${{ needs.generator-review.outputs.progress_reason }}
        run: |
          DECISION=error
          if [ "$CI_RESULT" = success ] && [ "$REVIEW_OK" = true ] && [ "$CAN_REPAIR" != true ]; then DECISION=exhausted; fi
          if [ "$CI_RESULT" = success ] && [ "$REVIEW_OK" = true ] && [ "$REPAIRABLE" = false ]; then DECISION=unrepairable; fi
          # F4: the repair loop was abandoned early because it was not converging.
          if [ "$CI_RESULT" = success ] && [ "$REVIEW_OK" = true ] && [ "$CONVERGING" = false ]; then
            DECISION=exhausted
            echo "Repair loop abandoned before dispatching the fixer: $PROGRESS_REASON"
            { echo "## Repair convergence"; echo; echo "- decision: **abandon**"; echo "- reason: $PROGRESS_REASON"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-generator.outputs.head_sha }}" --context automation/opus-gate --state failure --description "Automation blocked: $DECISION"
          VERDICT_ARGS=(); [ -f gate-verdict.json ] && VERDICT_ARGS=(--verdict gate-verdict.json)
          FAILURE_ARGS=()
          if [ "$CI_RESULT" != success ]; then FAILURE_ARGS=(--failure-class ci --failure-name generator-ci --failure-result "$CI_RESULT"); fi
          node scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-generator.outputs.pr_number }}" --kind "$AUTOMATION_KIND" --sha "${{ needs.validate-generator.outputs.head_sha }}" --decision "$DECISION" --attempt "${{ steps.budget.outputs.attempt }}" "${VERDICT_ARGS[@]}" "${FAILURE_ARGS[@]}" --out blocked-audit.json
      - if: ${{ steps.recover.outputs.action != 'retry' }}
        uses: actions/upload-artifact@v4
        with:
          name: blocked-audit-${{ needs.validate-generator.outputs.head_sha }}
          path: blocked-audit.json
          if-no-files-found: error
      - name: Notify Slack once when configured
        if: ${{ steps.block.outputs.comment_created == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL set — skipping alert."; exit 0; }
          jq -n --arg text "Automation blocked PR #${{ needs.validate-generator.outputs.pr_number }} at ${{ needs.validate-generator.outputs.head_sha }}" '{text:$text}' | curl --fail --silent --show-error -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" >/dev/null
          echo "Slack notified."

  # F6. A validation throw used to leave the PR completely invisible: block-generator
  # is gated on `trusted == 'true'`, which a failed validate-generator never emits, so
  # nothing labelled, nothing published a status, and nothing commented. This job is
  # the always() counterpart — mutually exclusive with block-generator by construction,
  # because the two conditions cannot both hold.
  validation-failed-generator:
    needs: [validate-generator]
    if: ${{ always() && github.event.client_payload.kind != 'promotion' && needs.validate-generator.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publish a visible terminal state for a refused or errored validation
        id: block
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "$AUTOMATION_SHA" --context automation/opus-gate --state failure --description "Automation blocked: validation-failed"
          node scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "$AUTOMATION_PR" --kind "$AUTOMATION_KIND" --sha "$AUTOMATION_SHA" --decision validation-failed --attempt 0 --out validation-failed-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-failed-audit-${{ github.event.client_payload.head_sha }}
          path: validation-failed-audit.json
          if-no-files-found: error
      - name: Notify Slack once when configured
        if: ${{ steps.block.outputs.comment_created == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL set — skipping alert."; exit 0; }
          jq -n --arg text "Automation validation failed for PR #$AUTOMATION_PR at $AUTOMATION_SHA — the PR is labelled ${{ '' }}automation-blocked" '{text:$text}' | curl --fail --silent --show-error -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" >/dev/null
          echo "Slack notified."

  validate-promotion:
    if: ${{ github.event.client_payload.kind == 'promotion' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.validate.outputs.trusted }}
      no_changes: ${{ steps.validate.outputs.no_changes }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      main_sha: ${{ steps.validate.outputs.main_sha }}
      range: ${{ steps.validate.outputs.range }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          LV_PROMOTION_ENABLED: ${{ vars.LV_PROMOTION_ENABLED }}
          LV_WEEKLY_OWNER: ${{ vars.LV_WEEKLY_OWNER }}
        run: node scripts/automation/coordinator.mjs validate-promotion --repo "$GITHUB_REPOSITORY" --sha "$AUTOMATION_SHA"

  prepare-promotion:
    needs: validate-promotion
    if: ${{ needs.validate-promotion.outputs.trusted == 'true' && needs.validate-promotion.outputs.no_changes != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs prepare-promotion --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-promotion.outputs.head_sha }}"

  validate-promotion-pr:
    needs: [validate-promotion, prepare-promotion]
    if: ${{ needs.validate-promotion.outputs.trusted == 'true' && needs.prepare-promotion.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      trusted: ${{ steps.validate.outputs.trusted }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      attempt: ${{ steps.validate.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs validate-pr --repo "$GITHUB_REPOSITORY" --pr "${{ needs.prepare-promotion.outputs.pr_number }}" --kind promotion --sha "${{ needs.prepare-promotion.outputs.head_sha }}"

  promotion-ci:
    needs: [validate-promotion, validate-promotion-pr]
    if: ${{ needs.validate-promotion-pr.outputs.trusted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.validate-promotion-pr.outputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Verify merge ref contains exact validated base and head
        env:
          EXPECTED_BASE: ${{ needs.validate-promotion.outputs.main_sha }}
          EXPECTED_HEAD: ${{ needs.validate-promotion-pr.outputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - run: npm ci
      - run: npm run lint:automation
      - run: npm run lint:changed
      - run: npm run build
      - run: npm run test:automation
      - run: npm run test:news-pilot
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  promotion-ci-status:
    needs: [validate-promotion-pr, promotion-ci]
    if: ${{ always() && needs.validate-promotion-pr.outputs.trusted == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.promotion-ci.result }}
        run: |
          STATE=failure; [ "$CI_RESULT" = success ] && STATE=success
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}" --context automation/ci --state "$STATE" --description "Promotion merge-ref CI: $CI_RESULT"

  promotion-review:
    needs:
      [
        validate-promotion,
        validate-promotion-pr,
        promotion-ci,
        promotion-ci-status,
      ]
    if: ${{ needs.validate-promotion-pr.outputs.trusted == 'true' && needs.promotion-ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review_ok: ${{ steps.review.outputs.review_ok }}
      passed: ${{ steps.review.outputs.passed }}
      overall: ${{ steps.review.outputs.overall }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/review-agent.mjs review --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-promotion-pr.outputs.pr_number }}" --kind promotion --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}" --base-sha "${{ needs.validate-promotion.outputs.main_sha }}" --out promotion-verdict.json
      - if: ${{ steps.review.outputs.review_ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: promotion-verdict-${{ needs.validate-promotion-pr.outputs.head_sha }}
          path: promotion-verdict.json
          if-no-files-found: error

  promotion-gate-status:
    needs: [validate-promotion-pr, promotion-ci, promotion-review]
    if: ${{ always() && needs.validate-promotion-pr.outputs.trusted == 'true' && needs.promotion-ci.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OK: ${{ needs.promotion-review.outputs.review_ok }}
          PASSED: ${{ needs.promotion-review.outputs.passed }}
        run: |
          STATE=failure; DESCRIPTION="Cumulative Opus gate errored"
          if [ "$REVIEW_OK" = true ]; then DESCRIPTION="Cumulative Opus score ${{ needs.promotion-review.outputs.overall }}/10"; fi
          if [ "$REVIEW_OK" = true ] && [ "$PASSED" = true ]; then STATE=success; fi
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}" --context automation/opus-gate --state "$STATE" --description "$DESCRIPTION"

  pass-promotion:
    needs:
      [
        validate-promotion,
        validate-promotion-pr,
        promotion-ci,
        promotion-review,
        promotion-gate-status,
      ]
    if: ${{ needs.validate-promotion-pr.outputs.trusted == 'true' && needs.promotion-ci.result == 'success' && needs.promotion-review.outputs.review_ok == 'true' && needs.promotion-review.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: promotion-verdict-${{ needs.validate-promotion-pr.outputs.head_sha }}
      - id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/automation/coordinator.mjs validate-promotion --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}" --main-sha "${{ needs.validate-promotion.outputs.main_sha }}"
          node scripts/automation/coordinator.mjs validate-pr --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-promotion-pr.outputs.pr_number }}" --kind promotion --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}"
          node scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-promotion-pr.outputs.pr_number }}" --kind promotion --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}" --decision promoted --attempt 0 --range "${{ needs.validate-promotion.outputs.range }}" --verdict promotion-verdict.json --out promotion-audit.json
          gh pr merge "${{ needs.validate-promotion-pr.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" --auto --merge
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-audit-${{ needs.validate-promotion-pr.outputs.head_sha }}
          path: promotion-audit.json
          if-no-files-found: error

  block-promotion:
    needs:
      [
        validate-promotion,
        prepare-promotion,
        validate-promotion-pr,
        promotion-ci,
        promotion-ci-status,
        promotion-review,
        promotion-gate-status,
        pass-promotion,
      ]
    if: ${{ always() && needs.validate-promotion-pr.outputs.trusted == 'true' && needs.pass-promotion.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: promotion-verdict-${{ needs.validate-promotion-pr.outputs.head_sha }}
      - id: block
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}" --context automation/opus-gate --state failure --description "Cumulative promotion blocked"
          VERDICT_ARGS=(); [ -f promotion-verdict.json ] && VERDICT_ARGS=(--verdict promotion-verdict.json)
          node scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "${{ needs.validate-promotion-pr.outputs.pr_number }}" --kind promotion --sha "${{ needs.validate-promotion-pr.outputs.head_sha }}" --decision blocked --attempt 0 --range "${{ needs.validate-promotion.outputs.range }}" "${VERDICT_ARGS[@]}" --out promotion-blocked-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-blocked-audit-${{ needs.validate-promotion-pr.outputs.head_sha }}
          path: promotion-blocked-audit.json
          if-no-files-found: error
      - name: Notify Slack once when configured
        if: ${{ steps.block.outputs.comment_created == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL set — skipping alert."; exit 0; }
          jq -n --arg text "Cumulative promotion blocked at ${{ needs.validate-promotion-pr.outputs.head_sha }}" '{text:$text}' | curl --fail --silent --show-error -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" >/dev/null
          echo "Slack notified."

  # The promotion counterpart. block-promotion is gated on validate-promotion-pr's
  # trusted output, so a throw anywhere earlier in the promotion chain — the range
  # validation, the PR preparation, or the PR validation itself — leaves no trace.
  # `no_changes` is a documented no-op and deliberately does NOT reach here: that
  # path exits validate-promotion successfully.
  validation-failed-promotion:
    needs: [validate-promotion, prepare-promotion, validate-promotion-pr]
    if: ${{ always() && github.event.client_payload.kind == 'promotion' && (needs.validate-promotion.result != 'success' || needs.prepare-promotion.result == 'failure' || needs.validate-promotion-pr.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publish a visible terminal state for a refused promotion
        id: block
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ needs.validate-promotion-pr.outputs.pr_number }}
        run: |
          node scripts/automation/coordinator.mjs status --repo "$GITHUB_REPOSITORY" --sha "$AUTOMATION_SHA" --context automation/opus-gate --state failure --description "Cumulative promotion blocked: validation-failed"
          if [ -n "$PROMOTION_PR" ]; then
            node scripts/automation/coordinator.mjs audit --repo "$GITHUB_REPOSITORY" --pr "$PROMOTION_PR" --kind promotion --sha "$AUTOMATION_SHA" --decision validation-failed --attempt 0 --out validation-failed-promotion-audit.json
          else
            echo '{"decision":"validation-failed","commit_sha":"'"$AUTOMATION_SHA"'","kind":"promotion","note":"no promotion PR existed to comment on"}' > validation-failed-promotion-audit.json
            echo "No promotion PR exists yet; the failing head status is the terminal record."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: validation-failed-promotion-audit-${{ github.event.client_payload.head_sha }}
          path: validation-failed-promotion-audit.json
          if-no-files-found: error
      - name: Notify Slack once when configured
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL set — skipping alert."; exit 0; }
          jq -n --arg text "Cumulative promotion validation failed at $AUTOMATION_SHA" '{text:$text}' | curl --fail --silent --show-error -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" >/dev/null
          echo "Slack notified."
