# Weekly topic discovery
# Mondays 10:00 UTC, before the SEO improvement run at 10:11.
# Appends GSC / PostHog / SerpApi People-Also-Ask topics to data/topic-queue.json
# via trusted automation tooling from protected main. Never deletes topics.
# Credentials stay in env (or a 600-mode tempfile) and are never echoed.
name: Weekly Topic Discovery

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      store:
        description: "Content store. auto reads LV_CONTENT_STORE and defaults to git."
        required: false
        type: choice
        options:
          - auto
          - git
          - db
        default: auto
      content_target:
        description: "DB target. Production is main-only; a staging ref must pass staging."
        required: false
        type: choice
        options:
          - production
          - staging
        default: production

concurrency:
  group: weekly-topic-discovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      store: ${{ steps.decide.outputs.store }}
      target: ${{ steps.decide.outputs.target }}
      lane: ${{ steps.decide.outputs.lane }}
    steps:
      - name: Resolve content store route
        id: decide
        env:
          INPUT_STORE: ${{ github.event.inputs.store || '' }}
          INPUT_CONTENT_TARGET: ${{ github.event.inputs.content_target || '' }}
          INPUT_SEO_LANE: ${{ github.event.inputs.seo_lane || '' }}
          LV_CONTENT_STORE: ${{ vars.LV_CONTENT_STORE || '' }}
          LV_CONTENT_CUTOVER_HOLD: ${{ vars.LV_CONTENT_CUTOVER_HOLD || '' }}
        run: |
          # route-writer:begin
          set -euo pipefail
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          case "${INPUT_STORE:-}" in
            git|db) STORE="$INPUT_STORE" ;;
            auto|"") STORE="${LV_CONTENT_STORE:-git}" ;;
            *) fail "unknown store input: ${INPUT_STORE}" ;;
          esac
          case "$STORE" in
            git|db) ;;
            *) fail "unknown store: ${STORE}" ;;
          esac

          if [ "${LV_CONTENT_CUTOVER_HOLD:-}" = "1" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] \
              || [ "${GITHUB_REF:-}" != "refs/heads/staging" ] \
              || [ "$STORE" != "db" ] \
              || [ "${INPUT_CONTENT_TARGET:-}" != "staging" ]; then
              fail "LV_CONTENT_CUTOVER_HOLD refuses this writer event before side effects"
            fi
          fi

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              TARGET="${INPUT_CONTENT_TARGET:-production}"
              if [ "$TARGET" != "production" ]; then
                fail "content-production is main-only and content-staging requires refs/heads/staging"
              fi
              ;;
            refs/heads/staging)
              if [ "${INPUT_CONTENT_TARGET:-}" != "staging" ] || [ "$STORE" != "db" ]; then
                fail "staging ref requires store=db and content_target=staging"
              fi
              TARGET="staging"
              ;;
            *)
              fail "unknown ref: ${GITHUB_REF:-}"
              ;;
          esac

          LANE=""
          if [ "${ROUTE_SEO:-}" = "1" ] && [ "$STORE" = "db" ]; then
            LANE="${INPUT_SEO_LANE:-data}"
            case "$LANE" in
              data|code) ;;
              *) fail "unknown seo_lane: ${LANE}" ;;
            esac
          fi

          {
            echo "store=${STORE}"
            echo "target=${TARGET}"
            echo "lane=${LANE}"
          } >> "$GITHUB_OUTPUT"
          # route-writer:end
  legacy:
    needs: route
    if: ${{ needs.route.outputs.store == 'git' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Checkout trusted policy tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Keep the trusted tooling out of the generated-data worktree
        run: echo 'trusted/' >> .git/info/exclude

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Write vaulted GSC credentials
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null
          test "$(stat -c '%a' /tmp/gsa-credentials.json)" = 600

      - name: Append discovered topics via trusted tooling
        id: discover
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          POSTHOG_PERSONAL_API_KEY_LIBERTYVILLAGE: ${{ secrets.POSTHOG_PERSONAL_API_KEY_LIBERTYVILLAGE }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node trusted/scripts/automation/topic-queue.mjs discover

      - name: Open pull request for queue updates
        id: pr
        if: ${{ steps.discover.outputs.added != '' && steps.discover.outputs.added != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LV Content Bot"
          git config user.email "noreply@libertyvillage.co"
          BR="auto/topic-discovery-$(date +%s)"
          git checkout -b "$BR"
          git add data/topic-queue.json
          if git diff --cached --quiet; then echo "No queue changes"; echo "created=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore: append discovered topics to the rotation queue"
          git push -u origin "$BR"
          URL=$(gh pr create --base staging --head "$BR" \
            --title "chore: append discovered topics $(date +%Y-%m-%d)" \
            --body "Trusted weekly topic discovery. Append-only update to \`data/topic-queue.json\` from GSC, PostHog, and SerpApi People Also Ask. Never deletes topics and does not lower the Opus gate.")
          PR=$(gh pr view "$URL" --json number --jq .number)
          SHA=$(git rev-parse HEAD)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Explicitly dispatch shared coordinator
        if: ${{ steps.pr.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs dispatch --repo "$GITHUB_REPOSITORY" --pr "${{ steps.pr.outputs.pr_number }}" --kind topic-discovery --sha "${{ steps.pr.outputs.head_sha }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gsa-credentials.json
  db:
    needs: route
    if: ${{ needs.route.outputs.store == 'db' && needs.route.outputs.lane != 'code' }}
    environment: content-${{ needs.route.outputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CONTENT_DATABASE_URL: ${{ secrets.CONTENT_DATABASE_URL }}
      CONTENT_DATABASE_URL_UNPOOLED: ${{ secrets.CONTENT_DATABASE_URL_UNPOOLED }}
      CONTENT_DEPLOY_HOOK_URL: ${{ secrets.CONTENT_DEPLOY_HOOK_URL }}
      CONTENT_SITE_BYPASS: ${{ secrets.CONTENT_SITE_BYPASS }} # absent in content-production
      CONTENT_DB_NAME: ${{ vars.CONTENT_DB_NAME }}
      CONTENT_SITE_URL: ${{ vars.CONTENT_SITE_URL }}
      CONTENT_TARGET: ${{ needs.route.outputs.target }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin main staging
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node scripts/content/cli.mjs export --root .
      - name: Checkout trusted policy tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Keep the trusted tooling out of the generated-data worktree
        run: echo 'trusted/' >> .git/info/exclude
      - name: Write vaulted GSC credentials
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null
          test "$(stat -c '%a' /tmp/gsa-credentials.json)" = 600
      - name: Append discovered topics via trusted tooling
        id: discover
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          POSTHOG_PERSONAL_API_KEY_LIBERTYVILLAGE: ${{ secrets.POSTHOG_PERSONAL_API_KEY_LIBERTYVILLAGE }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node trusted/scripts/automation/topic-queue.mjs discover
      - name: Submit topic-discovery content
        run: |
          set -euo pipefail
          node scripts/content/cli.mjs submit --dir . --kind topic-discovery --idempotency-key "gha:weekly-topic-discovery:${{ github.run_id }}:${{ github.run_attempt }}" > submit.json
      - name: Gate topic-discovery content
        run: |
          set -euo pipefail
          ID=$(jq -r '.submissionId' submit.json)
          if [ "$ID" = "null" ]; then
            exit 0
          fi
          node scripts/content/cli.mjs gate --submission "$ID"
      - name: Alert content DB job failure
        if: ${{ failure() }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          text="⚠ ${GITHUB_WORKFLOW} DB content job failed (${CONTENT_TARGET}); https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -cn --arg text "$text" '{text:$text}')
          curl --fail --silent --show-error --max-time 10 -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null || true
