# Weekly SEO/AEO Improvement Pipeline
# Analyzes Google Search Console performance and opens a PR with data-backed
# on-site improvements (meta, FAQ, internal links, schema, content, new pages).
# It never pushes to main; it opens a non-draft staging PR for autonomous gates.
#
# Requires repo secrets: GOOGLE_SERVICE_ACCOUNT_JSON, ANTHROPIC_API_KEY, GA_PROPERTY_ID,
#   SLACK_WEBHOOK_URL (for alerts). Optional: DATAFORSEO_LOGIN/DATAFORSEO_PASSWORD, SERPER_API_KEY.
# Also requires: Settings → Actions → "Allow GitHub Actions to create and approve pull requests".
name: Weekly SEO Improvements

on:
  schedule:
    # Mondays ~6am ET. 10:11 UTC = 6:11am EDT (summer) / 5:11am EST (winter).
    - cron: '11 10 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - analyze + summarize, make no edits / no PR'
        required: false
        type: boolean
        default: false
      force_edit:
        description: 'Force at least one improvement (guarantees a PR even on a marginal week)'
        required: false
        type: boolean
        default: false
      store:
        description: "Content store. auto reads LV_CONTENT_STORE and defaults to git."
        required: false
        type: choice
        options:
          - auto
          - git
          - db
        default: auto
      content_target:
        description: "DB target. Production is main-only; a staging ref must pass staging."
        required: false
        type: choice
        options:
          - production
          - staging
        default: production
      seo_lane:
        description: "SEO lane when store=db. Ignored when the store is git."
        required: false
        type: choice
        options:
          - data
          - code
        default: data

concurrency:
  group: weekly-seo
  cancel-in-progress: false

permissions:
  contents: write
  # The bounded candidate ladder creates the controlled regeneration/abandonment
  # labels and maintains its durable state issue.
  issues: write
  pull-requests: write

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      store: ${{ steps.decide.outputs.store }}
      target: ${{ steps.decide.outputs.target }}
      lane: ${{ steps.decide.outputs.lane }}
    steps:
      - name: Resolve content store route
        id: decide
        env:
          INPUT_STORE: ${{ github.event.inputs.store || '' }}
          INPUT_CONTENT_TARGET: ${{ github.event.inputs.content_target || '' }}
          INPUT_SEO_LANE: ${{ github.event.inputs.seo_lane || '' }}
          LV_CONTENT_STORE: ${{ vars.LV_CONTENT_STORE || '' }}
          LV_CONTENT_CUTOVER_HOLD: ${{ vars.LV_CONTENT_CUTOVER_HOLD || '' }}
          ROUTE_SEO: "1"
        run: |
          # route-writer:begin
          set -euo pipefail
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          case "${INPUT_STORE:-}" in
            git|db) STORE="$INPUT_STORE" ;;
            auto|"") STORE="${LV_CONTENT_STORE:-git}" ;;
            *) fail "unknown store input: ${INPUT_STORE}" ;;
          esac
          case "$STORE" in
            git|db) ;;
            *) fail "unknown store: ${STORE}" ;;
          esac

          if [ "${LV_CONTENT_CUTOVER_HOLD:-}" = "1" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] \
              || [ "${GITHUB_REF:-}" != "refs/heads/staging" ] \
              || [ "$STORE" != "db" ] \
              || [ "${INPUT_CONTENT_TARGET:-}" != "staging" ]; then
              fail "LV_CONTENT_CUTOVER_HOLD refuses this writer event before side effects"
            fi
          fi

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              TARGET="${INPUT_CONTENT_TARGET:-production}"
              if [ "$TARGET" != "production" ]; then
                fail "content-production is main-only and content-staging requires refs/heads/staging"
              fi
              ;;
            refs/heads/staging)
              if [ "${INPUT_CONTENT_TARGET:-}" != "staging" ] || [ "$STORE" != "db" ]; then
                fail "staging ref requires store=db and content_target=staging"
              fi
              TARGET="staging"
              ;;
            *)
              fail "unknown ref: ${GITHUB_REF:-}"
              ;;
          esac

          LANE=""
          if [ "${ROUTE_SEO:-}" = "1" ] && [ "$STORE" = "db" ]; then
            LANE="${INPUT_SEO_LANE:-data}"
            case "$LANE" in
              data|code) ;;
              *) fail "unknown seo_lane: ${LANE}" ;;
            esac
          fi

          {
            echo "store=${STORE}"
            echo "target=${TARGET}"
            echo "lane=${LANE}"
          } >> "$GITHUB_OUTPUT"
          # route-writer:end
  legacy:
    needs: route
    if: ${{ needs.route.outputs.store == 'git' || needs.route.outputs.lane == 'code' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEO_MODE: ${{ needs.route.outputs.lane == 'code' && 'code' || '' }}
    steps:
      # staging is the GENERATED-DATA worktree and nothing more.
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      # Trusted tooling comes from protected main, never from the mutable staging
      # checkout the agent is about to write into.
      - name: Checkout trusted policy tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Keep the trusted tooling out of the generated-data worktree
        run: echo 'trusted/' >> .git/info/exclude

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Resolve the next eligible SEO topic
        id: topic
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs resolve-topic --repo "$GITHUB_REPOSITORY" --kind seo

      # F14. The same bounded candidate ladder the blog path uses, on the SEO kind.
      # An exhausted or stranded SEO candidate is closed and regenerated after the
      # cooldown, and the third failure abandons the topic visibly — no hot loop and
      # no re-push of a rejected draft. Every command below names this pipeline's own
      # generator kind; the blog kind belongs to the blog workflow and only there.
      - name: Apply the bounded candidate policy before generating anything
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs plan-candidate --repo "$GITHUB_REPOSITORY" --kind seo --topic-key "${{ steps.topic.outputs.topic_key }}"

      - name: Report the candidate decision
        run: |
          {
            echo "## Candidate policy (seo)"
            echo
            echo "- decision: **${{ steps.candidate.outputs.action }}**"
            echo "- reason: ${{ steps.candidate.outputs.reason }}"
            echo "- generating this cycle: ${{ steps.candidate.outputs.generate }}"
            echo "- regenerations used: ${{ steps.candidate.outputs.regenerations }}"
            echo "- topic key: \`${{ steps.topic.outputs.topic_key }}\`"
            echo "- topic: ${{ steps.topic.outputs.topic_title }}"
            echo "- durable ladder: issue #${{ steps.candidate.outputs.state_issue }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright Chromium
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        run: npx playwright install chromium

      - name: Write service-account credentials
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null

      - name: Run SEO improvement agent
        id: generate
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_EDIT: ${{ inputs.force_edit }}
          TOPIC_KEY: ${{ steps.topic.outputs.topic_key }}
          TOPIC_OVERRIDE: ${{ steps.topic.outputs.topic_title }}
        run: node scripts/seo-improve-agent.js

      - name: Show summary (dry run)
        if: ${{ steps.candidate.outputs.generate == 'true' && (inputs.dry_run == true || inputs.dry_run == 'true') }}
        run: cat tasks/seo-improve-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Code lane refuses data edits
        if: ${{ needs.route.outputs.lane == 'code' && steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'success' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: node scripts/content/seo-guard.mjs code-only
      - name: Guard — forbidden paths & change budget
        id: guard
        if: ${{ success() && steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'success' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          ALL=$(git status --porcelain | sed 's/^...//' | sed 's/.* -> //' | grep -vE '^tasks/seo-(improve-(summary\.md|runs/)|scores\.json)' || true)
          # FORBIDDEN paths -> hard fail (security). Checked on the full set.
          if echo "$ALL" | grep -qE '^(next\.config\.ts|vercel\.json|package(-lock)?\.json|tsconfig.*|eslint.*|\.github/|scripts/)'; then
            echo "::error::Agent modified a forbidden path — blocking PR."; exit 1
          fi
          # Real edits = changes under tracked content dirs only. Stray root files
          # (e.g. reader screenshots) are ignored here AND never staged (add-paths).
          CONTENT=$(echo "$ALL" | grep -E '^(app|components|data|lib|public)/' || true)
          echo "Real content changes:"; echo "$CONTENT"
          N=$(echo "$CONTENT" | grep -c . || true)
          if [ "$N" -gt 15 ]; then
            echo "::error::Change budget exceeded ($N files > 15) — refusing to open an automation PR."
            exit 1
          fi
          echo "nfiles=$N" >> "$GITHUB_OUTPUT"

      # Build is run inside the agent orchestrator (it must build before the
      # reader stage can screenshot the live site), so no separate gate here —
      # a build failure fails the agent step and stops the job before any PR.

      # Pre-PR failures (generator throw, or the forbidden-path/budget guard)
      # are the same bounded candidate as a blog lint refusal: trusted tooling,
      # one regeneration, cooldown, cap, visible ABANDONED_TOPIC. The original
      # failing step remains the visible job failure; these steps only record
      # and re-fail so Open Pull Request stays skipped.
      - name: Record the generation failure in the durable candidate ladder
        id: genfail
        if: ${{ failure() && steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_KEY: ${{ steps.topic.outputs.topic_key }}
        run: |
          node trusted/scripts/automation/coordinator.mjs record-candidate-outcome \
            --repo "$GITHUB_REPOSITORY" --kind seo --outcome generation-failed \
            --key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --topic-key "$TOPIC_KEY" \
            --reason "the SEO generator failed before a pull request existed"

      - name: Stop at GENERATION_FAILED_PRE_PR — no pull request is opened
        if: ${{ failure() && steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'failure' }}
        run: |
          {
            echo "## GENERATION_FAILED_PRE_PR"
            echo
            echo "The SEO generator failed before a pull request existed. No branch, no commit, no PR."
            echo "- ladder: **${{ steps.genfail.outputs.action }}** (${{ steps.genfail.outputs.regenerations }}/2 regenerations used)"
            echo "- topic abandoned: ${{ steps.genfail.outputs.abandoned }}"
            echo "- durable state: issue #${{ steps.genfail.outputs.state_issue }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SEO generator failed (GENERATION_FAILED_PRE_PR); the bounded candidate ladder recorded it."
          exit 1

      - name: Record the guard failure in the durable candidate ladder
        id: guardfail
        if: ${{ failure() && steps.candidate.outputs.generate == 'true' && steps.guard.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_KEY: ${{ steps.topic.outputs.topic_key }}
        run: |
          node trusted/scripts/automation/coordinator.mjs record-candidate-outcome \
            --repo "$GITHUB_REPOSITORY" --kind seo --outcome guard-failed \
            --key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --topic-key "$TOPIC_KEY" \
            --reason "the SEO pre-PR guard refused the draft before a pull request existed"

      - name: Stop at GUARD_FAILED_PRE_PR — no pull request is opened
        if: ${{ failure() && steps.candidate.outputs.generate == 'true' && steps.guard.outcome == 'failure' }}
        run: |
          {
            echo "## GUARD_FAILED_PRE_PR"
            echo
            echo "The SEO forbidden-path/change-budget guard refused this draft. No pull request."
            echo "- ladder: **${{ steps.guardfail.outputs.action }}** (${{ steps.guardfail.outputs.regenerations }}/2 regenerations used)"
            echo "- topic abandoned: ${{ steps.guardfail.outputs.abandoned }}"
            echo "- durable state: issue #${{ steps.guardfail.outputs.state_issue }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SEO guard refused the draft (GUARD_FAILED_PRE_PR); the bounded candidate ladder recorded it."
          exit 1

      - name: Read review scores
        id: scores
        if: ${{ steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'success' && steps.guard.outcome == 'success' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          OVERALL="n/a"; PASSED="true"
          if [ -f tasks/seo-scores.json ]; then
            OVERALL=$(jq -r '.overall // "n/a"' tasks/seo-scores.json)
            PASSED=$(jq -r '.passed // false' tasks/seo-scores.json)
          fi
          LABELS="seo-automation"
          [ "$PASSED" != "true" ] && LABELS="$LABELS,needs-work"
          {
            echo "overall=$OVERALL"
            echo "labels=$LABELS"
            echo "title=seo: weekly automated improvements (score ${OVERALL}/10, ${{ steps.guard.outputs.nfiles }} files)"
          } >> "$GITHUB_OUTPUT"

      - name: Open Pull Request
        id: cpr
        if: ${{ steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'success' && steps.guard.outcome == 'success' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "LV SEO Bot"
          git config user.email "noreply@libertyvillage.co"
          BR="seo/auto-$(date +%s)"
          git checkout -b "$BR"
          # Stage only real content dirs (reader shots live in /tmp; run artifacts gitignored)
          git add app components data lib public/images 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No content changes — no PR opened."; echo "created=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "${{ steps.scores.outputs.title }}"
          git push -u origin "$BR"
          # ensure labels exist (idempotent), then build repeatable --label flags
          LABEL_ARGS=""
          for l in $(echo "${{ steps.scores.outputs.labels }}" | tr ',' ' '); do
            gh label create "$l" --force >/dev/null 2>&1 || true
            LABEL_ARGS="$LABEL_ARGS --label $l"
          done
          URL=$(gh pr create --base staging --head "$BR" \
            --title "${{ steps.scores.outputs.title }}" \
            --body-file tasks/seo-improve-summary.md \
            $LABEL_ARGS)
          PR=$(gh pr view "$URL" --json number --jq .number)
          SHA=$(git rev-parse HEAD)
          echo "Opened PR: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Carries this topic's regeneration budget onto the fresh SEO candidate with the
      # same single-controlled-label lifecycle the blog path uses, so a rerun cannot
      # buy a fourth candidate.
      - name: Carry the regeneration budget onto the fresh candidate
        if: ${{ steps.cpr.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs mark-regeneration --repo "$GITHUB_REPOSITORY" --pr "${{ steps.cpr.outputs.pr_number }}" --regenerations "${{ steps.candidate.outputs.regenerations }}"

      - name: Explicitly dispatch shared coordinator
        if: ${{ steps.cpr.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs dispatch --repo "$GITHUB_REPOSITORY" --pr "${{ steps.cpr.outputs.pr_number }}" --kind seo --sha "${{ steps.cpr.outputs.head_sha }}"

      - name: Notify Slack
        if: ${{ steps.cpr.outputs.created == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.url }}
          OVERALL: ${{ steps.scores.outputs.overall }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL set — skipping alert."; exit 0; }
          TLDR=$(sed -n '/## TL;DR/,/^## /p' tasks/seo-improve-summary.md | sed '1d;/^## /d' | head -6)
          STATUS=":mag: Weekly SEO staging PR opened — score ${OVERALL}/10"
          payload=$(jq -n --arg t "$STATUS: $PR_URL" --arg b "$TLDR" '{text: ($t + "\n" + $b)}')
          curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null && echo "Slack notified."

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gsa-credentials.json
  db:
    needs: route
    if: ${{ needs.route.outputs.store == 'db' && needs.route.outputs.lane != 'code' }}
    environment: content-${{ needs.route.outputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CONTENT_DATABASE_URL: ${{ secrets.CONTENT_DATABASE_URL }}
      CONTENT_DATABASE_URL_UNPOOLED: ${{ secrets.CONTENT_DATABASE_URL_UNPOOLED }}
      CONTENT_DEPLOY_HOOK_URL: ${{ secrets.CONTENT_DEPLOY_HOOK_URL }}
      CONTENT_SITE_BYPASS: ${{ secrets.CONTENT_SITE_BYPASS }} # absent in content-production
      CONTENT_DB_NAME: ${{ vars.CONTENT_DB_NAME }}
      CONTENT_SITE_URL: ${{ vars.CONTENT_SITE_URL }}
      CONTENT_TARGET: ${{ needs.route.outputs.target }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin main staging
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Write service-account credentials
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: node scripts/content/cli.mjs export --root .
      - name: Capture SEO baseline
        run: node scripts/content/seo-guard.mjs capture > /tmp/seo-base.json
      - name: Run SEO improvement agent
        id: generate
        env:
          SEO_MODE: data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_EDIT: ${{ inputs.force_edit }}
        run: node scripts/seo-improve-agent.js
      - name: Classify SEO data lane
        id: seo_data
        run: |
          set +e
          node scripts/content/seo-guard.mjs check /tmp/seo-base.json > /tmp/seo-guard.json
          code=$?
          set -e
          cat /tmp/seo-guard.json
          if [ "$code" -eq 2 ]; then
            echo "decision=mixed-blocked" >> "$GITHUB_OUTPUT"
            if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
              payload=$(jq -n --arg t "mixed-blocked: SEO data lane changed non-data files; no submit" '{text:$t}')
              curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null || true
            fi
            exit 2
          fi
          test "$code" -eq 0
          if [ "$(jq -r '.decision // empty' /tmp/seo-guard.json)" = "submit" ]; then
            echo "decision=submit" >> "$GITHUB_OUTPUT"
          else
            echo "decision=noop" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit seo content
        if: ${{ success() && steps.seo_data.outputs.decision == 'submit' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          node scripts/content/cli.mjs submit --dir . --kind seo --idempotency-key "gha:weekly-seo-improvements:${{ github.run_id }}:${{ github.run_attempt }}" > submit.json
      - name: Gate seo content
        if: ${{ success() && steps.seo_data.outputs.decision == 'submit' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.submissionId' submit.json)
          if [ "$ID" = "null" ]; then
            exit 0
          fi
          node scripts/content/cli.mjs gate --submission "$ID"
