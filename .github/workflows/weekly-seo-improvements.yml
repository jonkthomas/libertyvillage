# Weekly SEO/AEO Improvement Pipeline
# Analyzes Google Search Console performance and opens a PR with data-backed
# on-site improvements (meta, FAQ, internal links, schema, content, new pages).
# It NEVER pushes to main — a human reviews and merges the PR.
#
# Requires repo secrets: GOOGLE_SERVICE_ACCOUNT_JSON, ANTHROPIC_API_KEY, GA_PROPERTY_ID,
#   SLACK_WEBHOOK_URL (for alerts). Optional: DATAFORSEO_LOGIN/DATAFORSEO_PASSWORD, SERPER_API_KEY.
# Also requires: Settings → Actions → "Allow GitHub Actions to create and approve pull requests".
name: Weekly SEO Improvements

on:
  schedule:
    # Mondays ~6am ET. 10:11 UTC = 6:11am EDT (summer) / 5:11am EST (winter).
    - cron: '11 10 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - analyze + summarize, make no edits / no PR'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-seo
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Write service-account credentials
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null

      - name: Run SEO improvement agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/seo-improve-agent.js

      - name: Show summary (dry run)
        if: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        run: cat tasks/seo-improve-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guard — forbidden paths & change budget
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          # Count real content changes incl. NEW files (exclude the agent's run artifacts)
          CONTENT=$(git status --porcelain | sed 's/^...//' | sed 's/.* -> //' | grep -vE '^tasks/seo-(improve-(summary\.md|runs/)|scores\.json)' || true)
          echo "Changed content files:"; echo "$CONTENT"
          if echo "$CONTENT" | grep -qE '^(next\.config\.ts|vercel\.json|package(-lock)?\.json|tsconfig.*|eslint.*|\.github/|scripts/)'; then
            echo "::error::Agent modified a forbidden path — blocking PR."; exit 1
          fi
          N=$(echo "$CONTENT" | grep -c . || true)
          if [ "$N" -gt 12 ]; then
            echo "::error::Change budget exceeded ($N files > 12) — blocking PR."; exit 1
          fi

      # Build is run inside the agent orchestrator (it must build before the
      # reader stage can screenshot the live site), so no separate gate here —
      # a build failure fails the agent step and stops the job before any PR.

      - name: Read review scores
        id: scores
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          OVERALL="n/a"; PASSED="true"
          if [ -f tasks/seo-scores.json ]; then
            OVERALL=$(jq -r '.overall // "n/a"' tasks/seo-scores.json)
            PASSED=$(jq -r '.passed // false' tasks/seo-scores.json)
          fi
          DRAFT=false; LABELS="seo-automation"
          [ "$PASSED" != "true" ] && { DRAFT=true; LABELS="seo-automation,needs-work"; }
          {
            echo "overall=$OVERALL"
            echo "draft=$DRAFT"
            echo "labels=$LABELS"
            echo "title=seo: weekly automated improvements (score ${OVERALL}/10)"
          } >> "$GITHUB_OUTPUT"

      - name: Open Pull Request
        id: cpr
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: seo/auto
          branch-suffix: timestamp
          delete-branch: true
          add-paths: |
            app/**
            components/**
            data/**
            lib/**
            public/images/**
          commit-message: "seo: weekly automated improvements"
          title: ${{ steps.scores.outputs.title }}
          body-path: tasks/seo-improve-summary.md
          labels: ${{ steps.scores.outputs.labels }}
          draft: ${{ steps.scores.outputs.draft }}

      - name: Notify Slack
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          OVERALL: ${{ steps.scores.outputs.overall }}
          DRAFT: ${{ steps.scores.outputs.draft }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL set — skipping alert."; exit 0; }
          TLDR=$(sed -n '/## TL;DR/,/^## /p' tasks/seo-improve-summary.md | sed '1d;/^## /d' | head -6)
          STATUS=":mag: Weekly SEO PR opened — score ${OVERALL}/10"
          [ "$DRAFT" = "true" ] && STATUS=":warning: Weekly SEO PR (DRAFT, below threshold) — score ${OVERALL}/10"
          payload=$(jq -n --arg t "$STATUS: $PR_URL" --arg b "$TLDR" '{text: ($t + "\n" + $b)}')
          curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null && echo "Slack notified."

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gsa-credentials.json
