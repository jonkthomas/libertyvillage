name: Content store
on:
  push:
    paths:
      - 'scripts/content/**'
      - 'tests/content/**'
      - 'lib/content/**'
      - 'data/*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/content-ci.yml'
  pull_request:
    paths:
      - 'scripts/content/**'
      - 'tests/content/**'
      - 'lib/content/**'
      - 'data/*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/content-ci.yml'
jobs:
  content:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx eslint scripts/content tests/content
      - run: npm run test:content
      - run: npm run build
        env:
          CONTENT_SOURCE: json
