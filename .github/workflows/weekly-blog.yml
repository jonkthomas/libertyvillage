# Weekly Blog Pipeline
# Runs automatically every Sunday at 11:00 UTC (6am ET).
# Manual trigger: Actions tab → Weekly Blog Pipeline → Run workflow
#   - topic_override: provide a topic to skip SEO analysis
#   - dry_run: set true to generate without committing
name: Weekly Blog Pipeline

on:
  schedule:
    - cron: '0 11 * * 0'  # Every Sunday at 11:00 UTC (6am ET)
    - cron: '0 11 * * 3'  # Every Wednesday at 11:00 UTC (6am ET)
  workflow_dispatch:
    inputs:
      topic_override:
        description: 'Override topic (skip SEO analysis)'
        required: false
        type: string
      dry_run:
        description: 'Dry run - generate but do not commit'
        required: false
        type: boolean
        default: false
      force_gha:
        description: 'Explicitly run GHA generation even when owner.txt is exedev'
        required: false
        type: boolean
        default: false
      store:
        description: "Content store. auto reads LV_CONTENT_STORE and defaults to git."
        required: false
        type: choice
        options:
          - auto
          - git
          - db
        default: auto
      content_target:
        description: "DB target. Production is main-only; a staging ref must pass staging."
        required: false
        type: choice
        options:
          - production
          - staging
        default: production

concurrency:
  group: weekly-blog
  cancel-in-progress: false

permissions:
  contents: write
  # The candidate policy creates the controlled regeneration/abandonment labels and
  # posts the deduplicated closing comment on an exhausted candidate.
  issues: write
  pull-requests: write

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      store: ${{ steps.decide.outputs.store }}
      target: ${{ steps.decide.outputs.target }}
      lane: ${{ steps.decide.outputs.lane }}
    steps:
      - name: Resolve content store route
        id: decide
        env:
          INPUT_STORE: ${{ github.event.inputs.store || '' }}
          INPUT_CONTENT_TARGET: ${{ github.event.inputs.content_target || '' }}
          INPUT_SEO_LANE: ${{ github.event.inputs.seo_lane || '' }}
          LV_CONTENT_STORE: ${{ vars.LV_CONTENT_STORE || '' }}
          LV_CONTENT_CUTOVER_HOLD: ${{ vars.LV_CONTENT_CUTOVER_HOLD || '' }}
        run: |
          # route-writer:begin
          set -euo pipefail
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          case "${INPUT_STORE:-}" in
            git|db) STORE="$INPUT_STORE" ;;
            auto|"") STORE="${LV_CONTENT_STORE:-git}" ;;
            *) fail "unknown store input: ${INPUT_STORE}" ;;
          esac
          case "$STORE" in
            git|db) ;;
            *) fail "unknown store: ${STORE}" ;;
          esac

          if [ "${LV_CONTENT_CUTOVER_HOLD:-}" = "1" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] \
              || [ "${GITHUB_REF:-}" != "refs/heads/staging" ] \
              || [ "$STORE" != "db" ] \
              || [ "${INPUT_CONTENT_TARGET:-}" != "staging" ]; then
              fail "LV_CONTENT_CUTOVER_HOLD refuses this writer event before side effects"
            fi
          fi

          case "${GITHUB_REF:-}" in
            refs/heads/main)
              TARGET="${INPUT_CONTENT_TARGET:-production}"
              if [ "$TARGET" != "production" ]; then
                fail "content-production is main-only and content-staging requires refs/heads/staging"
              fi
              ;;
            refs/heads/staging)
              if [ "${INPUT_CONTENT_TARGET:-}" != "staging" ] || [ "$STORE" != "db" ]; then
                fail "staging ref requires store=db and content_target=staging"
              fi
              TARGET="staging"
              ;;
            *)
              fail "unknown ref: ${GITHUB_REF:-}"
              ;;
          esac

          LANE=""
          if [ "${ROUTE_SEO:-}" = "1" ] && [ "$STORE" = "db" ]; then
            LANE="${INPUT_SEO_LANE:-data}"
            case "$LANE" in
              data|code) ;;
              *) fail "unknown seo_lane: ${LANE}" ;;
            esac
          fi

          {
            echo "store=${STORE}"
            echo "target=${TARGET}"
            echo "lane=${LANE}"
          } >> "$GITHUB_OUTPUT"
          # route-writer:end
  resolve-owner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Checkout trusted owner control from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Resolve the canonical weekly owner
        id: owner
        run: node trusted/scripts/automation/weekly-owner.mjs --github-output

  legacy:
    needs: [route, resolve-owner]
    # Only the protected main owner file may enable scheduled GHA generation. A
    # valid exedev owner can be bypassed only by this explicit manual override.
    if: ${{ needs.route.outputs.store == 'git' && (needs.resolve-owner.outputs.owner == 'gha' || (github.event_name == 'workflow_dispatch' && inputs.force_gha == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # staging is the GENERATED-DATA worktree and nothing more: the agent writes
      # data/posts.json and images here. It is never the source of the tooling that
      # decides anything.
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      # Trusted tooling comes from main, which is protected and which no generated
      # content PR can reach (scripts/ is a forbidden path for every generator kind).
      # The candidate policy and the claim linter both run from here, so a mutated
      # staging checkout cannot rewrite the rules it is about to be judged by.
      - name: Checkout trusted policy and linter tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Keep the trusted tooling out of the generated-data worktree
        run: echo 'trusted/' >> .git/info/exclude

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Resolve the next eligible topic before spending a model turn. An empty
      # or fully-abandoned queue returns wait rather than blocking the lane.
      - name: Resolve the next eligible blog topic
        id: topic
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs resolve-topic --repo "$GITHUB_REPOSITORY" --kind blog

      # F14. Decide whether this topic may have a new candidate at all, before any
      # model spend. An exhausted candidate is closed and regenerated only after the
      # cooldown; a third failure abandons the topic to a human. Nothing here can
      # re-push a rejected draft — regeneration always means a fresh grounded one.
      - name: Apply the bounded candidate policy before generating anything
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs plan-candidate --repo "$GITHUB_REPOSITORY" --kind blog --topic-key "${{ steps.topic.outputs.topic_key }}"

      - name: Report the candidate decision
        run: |
          {
            echo "## Candidate policy"
            echo
            echo "- decision: **${{ steps.candidate.outputs.action }}**"
            echo "- reason: ${{ steps.candidate.outputs.reason }}"
            echo "- generating this cycle: ${{ steps.candidate.outputs.generate }}"
            echo "- regenerations used: ${{ steps.candidate.outputs.regenerations }}"
            echo "- topic key: \`${{ steps.topic.outputs.topic_key }}\`"
            echo "- topic: ${{ steps.topic.outputs.topic_title }}"
            echo "- durable ladder: issue #${{ steps.candidate.outputs.state_issue }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright Chromium
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        run: npx playwright install chromium

      - name: Write service-account credentials
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null

      - name: Run blog pipeline
        id: generate
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC_OVERRIDE: ${{ inputs.topic_override || steps.topic.outputs.topic_title }}
          TOPIC_KEY: ${{ steps.topic.outputs.topic_key }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/weekly-blog-agent.js

      # F1/F14. The linter runs from the trusted checkout against the generated data,
      # BEFORE any branch, commit or pull request exists. A refusal is a real bounded
      # candidate failure — it costs one regeneration and starts the cooldown — so it
      # is recorded in the durable ladder before the run fails. It only runs after a
      # successful generation so a generator throw cannot also be billed as a lint
      # refusal.
      - name: Refuse ungrounded claims before anything is committed
        id: lint
        if: ${{ steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'success' }}
        continue-on-error: true
        env:
          # L1 rollback lever: LINT_MODE=warn reports without discarding drafts.
          LINT_MODE: ${{ vars.LINT_MODE }}
        run: node trusted/scripts/blog-lint.mjs --posts data/posts.json --businesses data/businesses.json

      - name: Record the lint-refused draft in the durable candidate ladder
        id: discard
        if: ${{ steps.candidate.outputs.generate == 'true' && steps.lint.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_KEY: ${{ steps.topic.outputs.topic_key }}
        run: |
          node trusted/scripts/automation/coordinator.mjs record-candidate-outcome \
            --repo "$GITHUB_REPOSITORY" --kind blog --outcome lint-discarded \
            --key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --topic-key "$TOPIC_KEY" \
            --reason "the claim linter refused the draft before a pull request existed"

      - name: Stop at DISCARDED_PRE_PR — no pull request is opened for a refused draft
        if: ${{ steps.candidate.outputs.generate == 'true' && steps.lint.outcome == 'failure' }}
        run: |
          {
            echo "## DISCARDED_PRE_PR"
            echo
            echo "The claim linter refused this draft. No branch, no commit, no pull request."
            echo "- ladder: **${{ steps.discard.outputs.action }}** (${{ steps.discard.outputs.regenerations }}/2 regenerations used)"
            echo "- topic abandoned: ${{ steps.discard.outputs.abandoned }}"
            echo "- durable state: issue #${{ steps.discard.outputs.state_issue }}"
            echo
            echo "The next scheduled run regenerates a FRESH grounded draft after the cooldown;"
            echo "this one is not re-pushed and the gate was not lowered."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::blog-lint refused the draft (DISCARDED_PRE_PR); the bounded candidate ladder recorded it."
          exit 1

      # The generator itself can fail before a PR exists (model/tooling throw).
      # Same durable ladder as a lint refusal: one regeneration, cooldown, cap.
      # `if: failure()` keeps the original generate step as the visible failure;
      # this only records, then re-fails so later PR-opening steps stay skipped.
      - name: Record the generation failure in the durable candidate ladder
        id: genfail
        if: ${{ failure() && steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC_KEY: ${{ steps.topic.outputs.topic_key }}
        run: |
          node trusted/scripts/automation/coordinator.mjs record-candidate-outcome \
            --repo "$GITHUB_REPOSITORY" --kind blog --outcome generation-failed \
            --key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --topic-key "$TOPIC_KEY" \
            --reason "the generator failed before a pull request existed"

      - name: Stop at GENERATION_FAILED_PRE_PR — no pull request is opened
        if: ${{ failure() && steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'failure' }}
        run: |
          {
            echo "## GENERATION_FAILED_PRE_PR"
            echo
            echo "The blog generator failed before a pull request existed. No branch, no commit, no PR."
            echo "- ladder: **${{ steps.genfail.outputs.action }}** (${{ steps.genfail.outputs.regenerations }}/2 regenerations used)"
            echo "- topic abandoned: ${{ steps.genfail.outputs.abandoned }}"
            echo "- durable state: issue #${{ steps.genfail.outputs.state_issue }}"
            echo
            echo "The next scheduled run regenerates a FRESH grounded draft after the cooldown;"
            echo "this one is not re-pushed and the gate was not lowered."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::blog generator failed (GENERATION_FAILED_PRE_PR); the bounded candidate ladder recorded it."
          exit 1

      - name: Record provenance in the run summary instead of the pull request
        if: ${{ always() && steps.candidate.outputs.generate == 'true' }}
        run: |
          {
            echo "## Blog run provenance"
            echo
            echo "These files stay out of the scored diff (PRD ticket 1a) because the"
            echo "fixer cannot repair them: a finding on one guarantees exhaustion."
            echo
            for f in tasks/seo-data-latest.json tasks/auto-blog-runs/*.json; do
              [ -f "$f" ] || continue
              echo "- \`$f\` ($(wc -c < "$f") bytes)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open non-draft pull request into staging
        id: pr
        if: ${{ steps.candidate.outputs.generate == 'true' && steps.generate.outcome == 'success' && steps.lint.outcome == 'success' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LV Content Bot"
          git config user.email "noreply@libertyvillage.co"
          BR="blog/auto-$(date +%s)"
          git checkout -b "$BR"
          git add data/posts.json "public/images/blog/"
          if git diff --cached --quiet; then echo "No changes to commit"; echo "created=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "blog: weekly automated post $(date +%Y-%m-%d)"
          git push -u origin "$BR"
          URL=$(gh pr create --base staging --head "$BR" --title "blog: weekly automated post $(date +%Y-%m-%d)" --body "Automated weekly blog generation. CI and the autonomous Opus gate control staging merge eligibility.")
          PR=$(gh pr view "$URL" --json number --jq .number)
          SHA=$(git rev-parse HEAD)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Carries the topic's regeneration budget onto the fresh candidate, using the
      # same single-controlled-label lifecycle as the repair and heal series, so a
      # rerun cannot buy a fourth candidate.
      - name: Carry the regeneration budget onto the fresh candidate
        if: ${{ steps.pr.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs mark-regeneration --repo "$GITHUB_REPOSITORY" --pr "${{ steps.pr.outputs.pr_number }}" --regenerations "${{ steps.candidate.outputs.regenerations }}"

      - name: Explicitly dispatch shared coordinator
        if: ${{ steps.pr.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/automation/coordinator.mjs dispatch --repo "$GITHUB_REPOSITORY" --pr "${{ steps.pr.outputs.pr_number }}" --kind blog --sha "${{ steps.pr.outputs.head_sha }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gsa-credentials.json
  db:
    needs: [route, resolve-owner]
    if: ${{ needs.route.outputs.store == 'db' && needs.route.outputs.lane != 'code' && needs.resolve-owner.outputs.owner == 'gha' }}
    environment: content-${{ needs.route.outputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CONTENT_DATABASE_URL: ${{ secrets.CONTENT_DATABASE_URL }}
      CONTENT_DATABASE_URL_UNPOOLED: ${{ secrets.CONTENT_DATABASE_URL_UNPOOLED }}
      CONTENT_DEPLOY_HOOK_URL: ${{ secrets.CONTENT_DEPLOY_HOOK_URL }}
      CONTENT_SITE_BYPASS: ${{ secrets.CONTENT_SITE_BYPASS }} # absent in content-production
      CONTENT_DB_NAME: ${{ vars.CONTENT_DB_NAME }}
      CONTENT_SITE_URL: ${{ vars.CONTENT_SITE_URL }}
      CONTENT_TARGET: ${{ needs.route.outputs.target }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin main staging
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node scripts/content/cli.mjs export --root .
      - name: Write service-account credentials
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run blog pipeline
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC_OVERRIDE: ${{ inputs.topic_override }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/weekly-blog-agent.js
      - name: Submit blog content
        if: ${{ success() && inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          node scripts/content/cli.mjs submit --dir . --kind blog --idempotency-key "gha:weekly-blog:${{ github.run_id }}:${{ github.run_attempt }}" > submit.json
      - name: Gate blog content
        if: ${{ success() && inputs.dry_run != true && inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.submissionId' submit.json)
          if [ "$ID" = "null" ]; then
            exit 0
          fi
          node scripts/content/cli.mjs gate --submission "$ID"
      - name: Alert content DB job failure
        if: ${{ failure() }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          text="⚠ ${GITHUB_WORKFLOW} DB content job failed (${CONTENT_TARGET}); https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -cn --arg text "$text" '{text:$text}')
          curl --fail --silent --show-error --max-time 10 -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null || true
