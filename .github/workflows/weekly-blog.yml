# Weekly Blog Pipeline
# Runs automatically every Sunday at 11:00 UTC (6am ET).
# Manual trigger: Actions tab → Weekly Blog Pipeline → Run workflow
#   - topic_override: provide a topic to skip SEO analysis
#   - dry_run: set true to generate without committing
name: Weekly Blog Pipeline

on:
  schedule:
    - cron: '0 11 * * 0'  # Every Sunday at 11:00 UTC (6am ET)
    - cron: '0 11 * * 3'  # Every Wednesday at 11:00 UTC (6am ET)
  workflow_dispatch:
    inputs:
      topic_override:
        description: 'Override topic (skip SEO analysis)'
        required: false
        type: string
      dry_run:
        description: 'Dry run - generate but do not commit'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-blog
  cancel-in-progress: false

permissions:
  contents: write
  # The candidate policy creates the controlled regeneration/abandonment labels and
  # posts the deduplicated closing comment on an exhausted candidate.
  issues: write
  pull-requests: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # F14. Decide whether this topic may have a new candidate at all, before any
      # model spend. An exhausted candidate is closed and regenerated only after the
      # cooldown; a third failure abandons the topic to a human. Nothing here can
      # re-push a rejected draft — regeneration always means a fresh grounded one.
      - name: Apply the bounded candidate policy before generating anything
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs plan-candidate --repo "$GITHUB_REPOSITORY" --kind blog

      - name: Report the candidate decision
        run: |
          {
            echo "## Candidate policy"
            echo
            echo "- decision: **${{ steps.candidate.outputs.action }}**"
            echo "- reason: ${{ steps.candidate.outputs.reason }}"
            echo "- generating this cycle: ${{ steps.candidate.outputs.generate }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright Chromium
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        run: npx playwright install chromium

      - name: Write service-account credentials
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        env:
          GSA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          install -m 600 /dev/null /tmp/gsa-credentials.json
          printf '%s' "$GSA_JSON" > /tmp/gsa-credentials.json
          jq -e . /tmp/gsa-credentials.json > /dev/null

      - name: Run blog pipeline
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gsa-credentials.json
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC_OVERRIDE: ${{ inputs.topic_override }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/weekly-blog-agent.js

      - name: Refuse ungrounded claims before anything is committed
        if: ${{ steps.candidate.outputs.generate == 'true' }}
        env:
          # L1 rollback lever: LINT_MODE=warn reports without discarding drafts.
          LINT_MODE: ${{ vars.LINT_MODE }}
        run: node scripts/blog-lint.mjs --posts data/posts.json --businesses data/businesses.json

      - name: Record provenance in the run summary instead of the pull request
        if: ${{ always() && steps.candidate.outputs.generate == 'true' }}
        run: |
          {
            echo "## Blog run provenance"
            echo
            echo "These files stay out of the scored diff (PRD ticket 1a) because the"
            echo "fixer cannot repair them: a finding on one guarantees exhaustion."
            echo
            for f in tasks/seo-data-latest.json tasks/auto-blog-runs/*.json; do
              [ -f "$f" ] || continue
              echo "- \`$f\` ($(wc -c < "$f") bytes)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open non-draft pull request into staging
        id: pr
        if: ${{ steps.candidate.outputs.generate == 'true' && inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LV Content Bot"
          git config user.email "noreply@libertyvillage.co"
          BR="blog/auto-$(date +%s)"
          git checkout -b "$BR"
          git add data/posts.json "public/images/blog/"
          if git diff --cached --quiet; then echo "No changes to commit"; echo "created=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "blog: weekly automated post $(date +%Y-%m-%d)"
          git push -u origin "$BR"
          URL=$(gh pr create --base staging --head "$BR" --title "blog: weekly automated post $(date +%Y-%m-%d)" --body "Automated weekly blog generation. CI and the autonomous Opus gate control staging merge eligibility.")
          PR=$(gh pr view "$URL" --json number --jq .number)
          SHA=$(git rev-parse HEAD)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Carries the topic's regeneration budget onto the fresh candidate, using the
      # same single-controlled-label lifecycle as the repair and heal series, so a
      # rerun cannot buy a fourth candidate.
      - name: Carry the regeneration budget onto the fresh candidate
        if: ${{ steps.pr.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs mark-regeneration --repo "$GITHUB_REPOSITORY" --pr "${{ steps.pr.outputs.pr_number }}" --regenerations "${{ steps.candidate.outputs.regenerations }}"

      - name: Explicitly dispatch shared coordinator
        if: ${{ steps.pr.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/coordinator.mjs dispatch --repo "$GITHUB_REPOSITORY" --pr "${{ steps.pr.outputs.pr_number }}" --kind blog --sha "${{ steps.pr.outputs.head_sha }}"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gsa-credentials.json
